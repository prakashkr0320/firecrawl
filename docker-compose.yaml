name: firecrawl

services:
  playwright-service:
    build: apps/playwright-service-ts
    environment:
      PORT: 3000
    networks:
      - backend

  go-html-to-md:
    build: apps/go-html-to-md-service
    environment:
      PORT: 8080
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-300000}
    networks:
      - backend

  api:
    build: apps/api
    environment:
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:?FIRECRAWL_API_KEY is required}
      MAX_CONCURRENT_SCRAPES: ${MAX_CONCURRENT_SCRAPES:-10}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-300000}
      PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000}
      HTML_TO_MARKDOWN_SERVICE_URL: ${HTML_TO_MARKDOWN_SERVICE_URL:-http://go-html-to-md:8080}
      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}
    depends_on:
      - playwright-service
      - go-html-to-md
    ports:
      - "${PORT:-3002}:${INTERNAL_PORT:-3002}"
    command: node dist/src/fork/index.js
    networks:
      - backend

networks:
  backend:
    driver: bridge
